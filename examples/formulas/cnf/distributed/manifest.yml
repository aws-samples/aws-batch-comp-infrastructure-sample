# Distributed test problem set manifest
# Source: SAT Competition 2023/2024 benchmarks and Ramsey generator
# S3 base: s3://<satcomp-bucket>/benchmarks/sat/easy
#
# To download: aws s3 cp <s3_uri> <local_file>
# For Ramsey instances: cd other/sat-ramsay-generator && ./ramsey-generator <args>

problems:
  # --- Easy (solvable < 60s single-node) ---
  - file: 3col20_5_6.shuffled.cnf
    s3_key: 00f969737ba4338bd233cd3ed249bd55-3col20_5_6.shuffled.cnf
    expected: UNSAT
    difficulty: easy
    source: "SAT Competition 2024 easy benchmarks"
    notes: "Graph coloring, solved in <1s by cadical"

